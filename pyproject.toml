[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "el2d-lite-tools"
version = "0.1.0.dev0"
description = "Offline asset tools for the EL2D Lite embedded mesh runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
